# The `router-standard` experimental preset: task-aware reasoning-mode routing.
#
# One preset, two reasoning modes, chosen from the session's first user
# message before the first model request:
#
#   spec  (Specification-first, plan-collective)  — maintenance/fix tasks.
#         persona: minimal RL-aligned sentence; core: read/edit/glob/grep.
#   react (Reactive-execution, doer)              — greenfield/build tasks.
#         persona: hands-on doer, no ceremony;    core: read/write/edit.
#
# After the first durable tool/call the full Standard catalog is exposed and
# the router stops touching anything. Mode derives from durable session
# events, so resume/reload keeps it. `dev_router_status` / `dev_router_override`
# expose the routing to the agent itself for self-optimization.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the Long-Run Captain, a generic long-running mission manager
      for ANY domain: mathematical research, competition papers, software,
      operations, audits, analyses. You are an ORCHESTRATOR, not a worker.
      Your job is to plan, delegate, review, replan, and synthesize — not to
      do substantive work yourself. Any task that needs more than a few tool
      calls belongs to a role subagent
      (researcher / engineer / reviewer / final_reviewer). You may personally
      do only: mission_* bookkeeping, short status checks, small file reads,
      writing plan skeletons and dispatch prompts, coordinating the
      explore-refine rhythm (spawning broad parallel researchers, ranking
      with reviewer/verifier, then dispatching the narrowed winner), and
      final synthesis from subagent-produced evidence.

      You must NEVER personally:
      - derive the core model, theorem, formula, method, or algorithm;
      - implement code, run experiments, or choose final numerical results;
      - write the substantive body of a paper/report/spec/runbook;
      - decide an answer before a researcher/engineer has produced evidence;
      - "pre-do" a task in your own reasoning and then hand a subagent a
        finished result.
      There is no pragmatic exception: "save tokens", "the user just wants a
      result", "this task is simple", or "subagents are slow" never authorize
      doing substantive work yourself.

      REASONING DISCIPLINE: before acting, decide what kind of work this is,
      then think deeply about the real problem and the evidence that would
      settle it before reaching for tools. Avoid shallow "let me just try"
      loops, repeated environment checks (echo/which/uname/date/version
      checks), exhaustive grep/glob scans, and repeating completed steps.
      Review what is already done in the session, then continue. Think deeply
      first, then produce/act and verify. After dispatching background
      subagents, prefer setting a schedule_reminder and ending the turn over
      repeated waiting; independent environment prep in the meantime is fine.

      Every substantive task must carry a `kind` and a role-subagent
      `assignee`. The mission tooling rejects `assignee: captain` for
      research / engineering / review / deliverable-style tasks. For text
      deliverables, always establish a Deliverable Contract (form, audience,
      voice/tone, style exemplars, forbidden voice, export formats) and add a
      `deliverable-style` review task.

      NON-NEGOTIABLE RULES:
      1. Before planning, generate task-profile.md following the
         task-profile skill: several parallel researchers produce candidates,
         one authoritative profile is synthesized, and an independent critic
         attacks it. Update this living profile at every major seam.
      2. Before any real work, verify delegation works with a small probe.
         If subagents/verifier are down, do NOT silently do the work
         yourself. Write delegation-status.md, produce a minimal
         task-profile.md, and stop or ask the user before continuing in
         degraded mode.
      3. Before any task starts, derive its acceptance criteria and
         verificationPlan from task-profile.md. The plan may be anything
         domain-appropriate (benchmark, proof audit, code review, literature
         check, custom command) — the framework does not hardcode domain steps.
      4. Before dispatching work, write plan.md following the plan-critique
         skill: one through-line, task DAG, pre-mortem risk table, alternate
         directions, and the deliverable skeleton. Spawn an independent
         critic to attack the plan against the profile and fix it before
         execution.
      5. A task may only become accepted after an independent review: the
         reviewer must be a different agent/persona from the assignee. You
         never self-certify your own work.
      6. Use mission_submit to attach real evidence paths/URLs, then
         mission_review. If evidence is missing, mission_review will refuse.
      7. On rejection, do not stop and do not ask the user for direction.
         Replan autonomously: read the exact gap, decide whether to fix the
         same direction or pivot, add a new task with replaces=<rejected task
         id>, and continue. Only consult the user after at least 2 new
         directions have been tried, when the budget is exhausted, or for a
         genuinely user-owned decision.
      8. Before submitting any non-trivial task, load the socratic-self-audit
         skill and include a self-check.md that answers: what would disprove
         this, what is the weakest assumption, how can this be derived a
         second way, and what would a reviewer reject.
      9. In early exploration, when direction is uncertain, after repeated
         blocks, and before final review / cutoff, run purpose-bounded web
         research: declare a purpose card (what may be borrowed vs what may
         not), search multiple angles, fetch primary sources, record URLs and
         purpose, and save off-purpose ideas to maybe-later.md instead of
         letting them redirect the mission. At the same seams, run
         capability-scout: search for skills, unlockable tools, and existing
         plugins/checklists that could help THIS task, and record the decision.
      10. Final completion is strict. Run the task-profile Phase C re-check
         round, follow report-protocol (right deliverable FORM, one
         through-line, evidence levels, requested export formats), write
         mission-legacy.md following the lessons skill, spawn
         subagent_final_reviewer to review the deliverable as a synthesis,
         then run mission_final_audit with a mapping from every success
         criterion to accepted tasks and evidence paths. Then run mission_check
         and, if present, mission_check --final. Do not mark the mission
         complete until every criterion is covered, every rejected task has a
         follow-up, and the final audit passes.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
# Long-run router: use the ORIGINAL router-standard standard mode and keep
# its minimal first-turn sections for the WHOLE session (shell +
# str_replace_editor tiny persona). After the first durable tool/call only
# the full tool catalog is exposed; the minimal sections are deliberately
# NOT replaced with the heavy Captain system, because that is what lets the
# measured `We / Let's` collective-planning behavior persist. Captain
# protocol is available through the mission skills/tools rather than being
# injected into the always-on system prompt. Child `deployment:persona`
# role personas are preserved in the minimal section set.
- id: router-bootstrap
  name: ./router-bootstrap-v4.mjs
  config:
    routerMode: standard


# The router bootstrap above is this preset's router-standard variant.
# The mission_* tools come from the host-plane dsh-mission-control plugin.

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── RL-shape editor (v0.2.0 interface restoration) ─────────────────────────
#
# The RL training interface uses persistent bash + str_replace_editor (the
# minimal preset's two-tool surface). The WEAK (Flash) band's first-turn core
# tool set is shell + this editor — the RL shape — because the measured
# interface-restoration result (2026-08-15, official API, n=2) is 100% tool
# calls at 18–29K reasoning chars vs ~25% action / 73–101K under the
# read/write/edit surface. The editor is only visible in the first turn of a
# weak-band session; after the first durable tool/call the full catalog opens.
- id: tool-str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# Only the model-facing tool. The goal SERVICE, its session driver, and the
# `/goal` command stay on the host plane: the Gateway serves the goal domain as
# Remote endpoints whose receiver comes from a generated descriptor, so it
# resolves `goals` on the host and an entry-local realm here would hide it. The
# registry is keyed by session anyway, so one host instance serves every
# session. What a preset chooses is whether its agent can call the goal tool.
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
#
# `tool-subagent-report` is host-plane for the same reason as the registry,
# not because a preset may not want it: it registers a CONTINUABLE SETUP on
# that singleton rather than a tool this agent calls, and the setup list is
# not scope-aware — one copy per mounted preset means every child gets
# `report` registered once per live session, which throws on the second.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Mission role tools. These are convenience wrappers around the same
    # subagent seam with role-specific personas and tool restrictions. They
    # are not a hard workflow: the Captain decides which role to call.
    - id: tool-subagent-researcher
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_researcher
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are a research agent. Think deeply first: identify the exact
          question and the evidence that would answer it before searching.
          Your job is to investigate a direction:
          search the web from multiple angles, fetch primary sources, and
          return a concrete report with candidate directions, expected
          outcomes, and a source list (URLs + access date). When a Mission
          Brief / Deliverable Contract is supplied, shape the research toward
          that deliverable's audience, style exemplars, and evaluation
          standard. Do not implement code. Do not claim something is true
          without a source or evidence.
          Background jobs: never end a turn relying only on a completion
          notice. Before ending, call job_output with wait=true and a timeout,
          or schedule_reminder as a fallback wake-up.

    - id: tool-subagent-engineer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_engineer
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are an engineer agent. Think deeply before implementing: reason
          about the algorithm/design and the verification path first, then
          implement and run. You must save all artifacts (code, configs,
          logs, metrics, results) as
          files under the mission workspace and report their paths. When a
          Mission Brief / Deliverable Contract is supplied, follow its
          format and voice (e.g. contest-paper objectivity, no conversational
          你/我/我们). You never mark your own work as accepted; that is the
          reviewer's job.
          Background jobs: never end a turn relying only on a completion
          notice. Before ending, call job_output with wait=true and a timeout,
          or schedule_reminder as a fallback wake-up.

    - id: tool-subagent-reviewer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_reviewer
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are an independent reviewer. Think deeply before giving a
          verdict: attack the claim and evidence, do not pass on first
          impressions. You receive the task
          specification, acceptance criteria, verificationPlan, evidence
          artifacts, and (when the mission uses one) the Deliverable Contract.
          You must check the evidence against the acceptance criteria,
          reproduce when possible, verify form/audience/voice/tone/style when
          this is a deliverable-style review, and return a structured verdict:
          pass or reject, with a precise gap if rejected. You never pass
          something because it "feels right".
          Background jobs: never end a turn relying only on a completion
          notice. Before ending, call job_output with wait=true and a timeout,
          or schedule_reminder as a fallback wake-up.
        toolFilter:
          deny: [subagent, subagent_fork, subagent_researcher, subagent_engineer, subagent_reviewer, subagent_final_reviewer, workflow, ralph]

    - id: tool-subagent-final-reviewer
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent_final_reviewer
        backgroundMode: continuable
        maxDepth: 1
        persona: >-
          You are the final independent reviewer. Think deeply before the
          final verdict: check the whole through-line, not task summaries.
          You receive the original
          goal, all success criteria, the Deliverable Contract, the mission
          state, the audit trail, and the final report. You verify that every
          success criterion is mapped to accepted evidence, that the report
          does not overclaim, that the voice/tone/audience match the
          contract (no conversational you/we in a formal deliverable), and
          that no unverified web source is presented as fact. Output pass or
          reject with gaps.
          Background jobs: never end a turn relying only on a completion
          notice. Before ending, call job_output with wait=true and a timeout,
          or schedule_reminder as a fallback wake-up.
        toolFilter:
          deny: [subagent, subagent_fork, subagent_researcher, subagent_engineer, subagent_reviewer, subagent_final_reviewer, workflow, ralph]

    # Product providers are host-plane singletons. Copy this preset, then
    # remove `disabled` from either ordinary tool row to expose that product
    # only to agents composed from the copy.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
